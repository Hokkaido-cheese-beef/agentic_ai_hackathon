  #     - name: Lint
  #       run: npm run lint

  #     - name: Test
  #       run: npm run test:run

  #     - name: Build
  #       run: npm run build

  build-and-push:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      commit_sha: ${{ steps.image_meta.outputs.commit_sha }}
      app_image_url: ${{ steps.image_meta.outputs.app_image_url }}
      ai_image_url: ${{ steps.image_meta.outputs.ai_image_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.commit_sha || 'refs/heads/main') || github.sha }}

      - name: Resolve commit SHA
        run: echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compute image URLs
        id: image_meta
        env:
          GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
          GAR_IMAGE: ${{ secrets.GAR_IMAGE }}
          GAR_AI_IMAGE: ${{ secrets.GAR_AI_IMAGE }}
        run: |
          AI_IMAGE_NAME="${GAR_AI_IMAGE:-${GAR_IMAGE}-ai}"
          APP_IMAGE_URL="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${GAR_IMAGE}:sha-${COMMIT_SHA}"
          AI_IMAGE_URL="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${AI_IMAGE_NAME}:sha-${COMMIT_SHA}"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "app_image_url=${APP_IMAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "ai_image_url=${AI_IMAGE_URL}" >> "$GITHUB_OUTPUT"

      - name: Debug image outputs
        run: |
          echo "commit_sha=${{ steps.image_meta.outputs.commit_sha }}"
          echo "app_image_url=${{ steps.image_meta.outputs.app_image_url }}"
          echo "ai_image_url=${{ steps.image_meta.outputs.ai_image_url }}"

      - name: Auth to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (app)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ secrets.GAR_IMAGE }}
          tags: |
            type=raw,value=sha-${{ env.COMMIT_SHA }}
            type=raw,value=latest

      - name: Build and push (app)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}

      - name: Extract Docker metadata (ai)
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ format('{0}-ai', secrets.GAR_IMAGE) }}
          tags: |
            type=raw,value=sha-${{ env.COMMIT_SHA }}
            type=raw,value=latest

      - name: Build and push (ai)
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          file: ./ai/Dockerfile
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}

  deploy:
    needs: build-and-push
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Auth to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Compute deploy image URLs
        env:
          GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
          GAR_IMAGE: ${{ secrets.GAR_IMAGE }}
          GAR_AI_IMAGE: ${{ secrets.GAR_AI_IMAGE }}
          BUILD_COMMIT_SHA: ${{ needs['build-and-push'].outputs.commit_sha }}
          INPUT_COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
        run: |
          COMMIT_SHA="${BUILD_COMMIT_SHA}"
          if [ -z "$COMMIT_SHA" ]; then
            COMMIT_SHA="${INPUT_COMMIT_SHA:-${GITHUB_SHA}}"
          fi
          AI_IMAGE_NAME="${GAR_AI_IMAGE:-${GAR_IMAGE}-ai}"
          APP_IMAGE_URL="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${GAR_IMAGE}:sha-${COMMIT_SHA}"
          AI_IMAGE_URL="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${AI_IMAGE_NAME}:sha-${COMMIT_SHA}"

          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "APP_IMAGE_URL=${APP_IMAGE_URL}" >> "$GITHUB_ENV"
          echo "AI_IMAGE_URL=${AI_IMAGE_URL}" >> "$GITHUB_ENV"

          echo "commit_sha=${COMMIT_SHA}"
          echo "app_image_url=${APP_IMAGE_URL}"
          echo "ai_image_url=${AI_IMAGE_URL}"

      - name: Deploy ai service
        env:
          RUN_REGION: ${{ secrets.CLOUD_RUN_REGION || secrets.GAR_LOCATION }}
          AI_SERVICE: ${{ secrets.CLOUD_RUN_AI_SERVICE || format('{0}-ai', secrets.GAR_IMAGE) }}
        run: |
          if [ -z "$AI_IMAGE_URL" ]; then
            echo "AI_IMAGE_URL is empty"
            exit 1
          fi
          gcloud run services update "$AI_SERVICE" \
            --region "$RUN_REGION" \
            --image "$AI_IMAGE_URL"

      - name: Deploy app service
        env:
          RUN_REGION: ${{ secrets.CLOUD_RUN_REGION || secrets.GAR_LOCATION }}
          APP_SERVICE: ${{ secrets.CLOUD_RUN_APP_SERVICE || secrets.GAR_IMAGE }}
        run: |
          if [ -z "$APP_IMAGE_URL" ]; then
            echo "APP_IMAGE_URL is empty"
            exit 1
          fi
          gcloud run services update "$APP_SERVICE" \
            --region "$RUN_REGION" \
            --image "$APP_IMAGE_URL"

      - name: Deployment summary
        run: |
          echo "commit_sha=${COMMIT_SHA}"
          echo "app_image_url=${APP_IMAGE_URL}"
          echo "ai_image_url=${AI_IMAGE_URL}"
