name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to build"
        required: false
        default: ""
      deploy:
        description: "Deploy to Cloud Run after image push"
        required: false
        type: boolean
        default: true

jobs:
